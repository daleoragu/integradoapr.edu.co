<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - Elecciones 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

    <!-- Barra Superior -->
    <div class="flex h-2 w-full">
        <div class="w-1/2 bg-[#FCD116]"></div>
        <div class="w-1/4 bg-[#003893]"></div>
        <div class="w-1/4 bg-[#CE1126]"></div>
    </div>

    <!-- Header Interno -->
    <header class="bg-[#003893] shadow-md text-white">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="{% url 'elecciones:panel_admin' %}" class="text-white hover:text-gray-200 mr-2" title="Volver al panel">
                    <i class="fas fa-arrow-left text-xl"></i>
                </a>
                <i class="fas {{ icono }} text-2xl text-[#FCD116]"></i>
                <h1 class="text-lg font-bold leading-tight">{{ titulo }}</h1>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-12 flex-grow flex justify-center">
        <div class="bg-white rounded-xl shadow-md p-8 w-full max-w-lg border-t-4 border-[#FCD116]">
            
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">{{ titulo }}</h2>

            <!-- SE AGREGÓ enctype="multipart/form-data" para permitir subida de archivos -->
            <form method="POST" class="space-y-4" enctype="multipart/form-data">
                {% csrf_token %}
                
                {% for field in form %}
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.help_text %}
                            <p class="text-xs text-gray-500 mt-1">{{ field.help_text }}</p>
                        {% endif %}
                        {% for error in field.errors %}
                            <p class="text-xs text-red-600 mt-1">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}

                <div class="pt-6 flex gap-4">
                    <a href="{% url 'elecciones:panel_admin' %}" class="w-1/3 text-center bg-gray-200 text-gray-800 py-2 rounded-md hover:bg-gray-300 font-medium transition-colors">
                        Cancelar
                    </a>
                    <button type="submit" class="w-2/3 bg-[#003893] text-white py-2 rounded-md hover:bg-blue-800 font-bold transition-colors shadow-md">
                        <i class="fas fa-save mr-1"></i> Guardar
                    </button>
                </div>
            </form>

        </div>
    </main>
</body>
</html>
