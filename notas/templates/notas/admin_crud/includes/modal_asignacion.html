<!-- Modal para Añadir/Editar Asignación -->
<div class="modal fade" id="asignacionModal" tabindex="-1" aria-labelledby="asignacionModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="asignacionModalLabel">Crear Nueva Asignación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="assignment-form" action="" method="post">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="id_curso" class="form-label">Curso / Grado:</label>
                        <select id="id_curso" name="curso" class="form-select" required>
                            <option value="">Seleccione un curso</option>
                            {% for curso in cursos %}
                                <option value="{{ curso.id }}">{{ curso.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="id_materia" class="form-label">Materia:</label>
                        <select id="id_materia" name="materia" class="form-select" required>
                            <option value="">Seleccione una materia</option>
                            {% for materia in materias %}
                                <option value="{{ materia.id }}">{{ materia.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="id_docente" class="form-label">Docente:</label>
                        <select id="id_docente" name="docente" class="form-select" required>
                            <option value="">Seleccione un docente</option>
                            {% for docente in docentes %}
                                <option value="{{ docente.id }}">{{ docente.user.get_full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="id_intensidad_horaria" class="form-label">Intensidad Horaria Semanal:</label>
                        <input type="number" id="id_intensidad_horaria" name="intensidad_horaria_semanal" class="form-control" min="1" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
